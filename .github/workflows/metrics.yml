name: Metrics
on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: KANISHKAPANDIARAJ
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          
          # Isometric 3D Calendar (as seen on top right of the image)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Coding Habits / Hourly Commit Chart
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Most Used Languages Bar
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8

          # Technology Stack / Mastered Topics
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons
